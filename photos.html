<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" href="Plugin icon - 1.png" type="image/png">.
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотографии - BMP Metro Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f7f7f9; }
        .font-black { font-weight: 900; }
        .font-light { font-weight: 300; }
        
        .page-transition { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Анимации для модального окна (приближения) */
        .modal-fade-enter { opacity: 0; pointer-events: none; }
        .modal-fade-enter-active { opacity: 1; pointer-events: auto; transition: opacity 0.3s ease; }
        .modal-scale-enter { transform: scale(0.95); }
        .modal-scale-enter-active { transform: scale(1); transition: transform 0.3s ease; }
    </style>
</head>
<body class="text-gray-900 flex flex-col min-h-screen">

    <header class="w-full bg-white flex justify-between items-center py-4 px-8 sticky top-0 z-50 border-b border-gray-100">
        <a href="index.html" class="flex items-center gap-3 cursor-pointer">
            <img src="Plugin icon - 1.png" alt="BMP Logo" class="w-10 h-10 rounded-full">
            <span class="font-black text-xl tracking-wide">BMP</span>
        </a>
        <nav class="hidden md:flex gap-8 text-sm font-medium text-gray-700">
            <a href="/" class="hover:text-red-500 transition-colors">Дом</a>
            <a href="development" class="hover:text-red-500 transition-colors">Разработка</a>
            <a href="map" class="hover:text-red-500 transition-colors">Маршруты</a>
            <div class="relative group cursor-pointer">
                <span class="hover:text-red-500 transition-colors flex items-center gap-1">Работа <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></span>
                <div class="absolute left-0 mt-4 w-40 bg-white border border-gray-100 shadow-xl rounded-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all">
                    <a href="vacancies.html" class="block px-5 py-3 hover:bg-gray-50 rounded-xl hover:text-red-500">Вакансии</a>
                </div>
            </div>
            <a href="documents" class="hover:text-red-500 transition-colors">Документы</a>
            <a href="links" class="hover:text-red-500 transition-colors">Ссылки</a>
            <a href="team" class="hover:text-red-500 transition-colors">Команда</a>
            <a href="photos" class="text-red-500 transition-colors">Фотографии</a>
        </nav>
    </header>

    <main class="flex-grow flex flex-col items-center px-4 py-16 w-full max-w-5xl mx-auto page-transition">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-black mb-4">Фотографии</h1>
            <p class="max-w-2xl mx-auto text-gray-600 leading-relaxed">
                Кадры со станций и процесс строительства нашего метрополитена.
            </p>
        </div>
        
        <div class="w-full bg-white rounded-[2rem] shadow-sm p-6 md:p-10 flex flex-col gap-8">
            
            <!-- Добавлен класс gallery-img для скрипта -->
            <img src="1.png" alt="Станция Институтская" class="gallery-img w-full h-auto rounded-xl border border-gray-100 shadow-sm hover:scale-[1.01] hover:shadow-md transition-all cursor-pointer">
            <img src="2.png" alt="Навигация Ольховка" class="gallery-img w-full h-auto rounded-xl border border-gray-100 shadow-sm hover:scale-[1.01] hover:shadow-md transition-all cursor-pointer">
            <img src="3.png" alt="Схема маршрутов на станции" class="gallery-img w-full h-auto rounded-xl border border-gray-100 shadow-sm hover:scale-[1.01] hover:shadow-md transition-all cursor-pointer">
            
        </div>
        
    </main>

    <!-- Темный фон и окно для увеличенной картинки -->
    <div id="imageModal" class="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex justify-center items-center modal-fade-enter hidden">
        
        <!-- Тот самый крестик -->
        <button id="closeModalBtn" class="absolute top-6 right-6 md:top-10 md:right-10 w-12 h-12 bg-white text-gray-900 border-2 border-gray-100 rounded-xl flex items-center justify-center hover:bg-red-500 hover:text-white hover:border-red-500 hover:scale-105 transition-all shadow-lg z-50">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>

        <img id="modalImg" src="" alt="Увеличенное фото" class="max-w-[90%] max-h-[90vh] rounded-2xl shadow-2xl object-contain modal-scale-enter">
    </div>

    <footer class="w-full bg-white border-t border-gray-100 py-6 px-8 flex flex-col md:flex-row justify-between items-center gap-4 text-gray-400 mt-auto">
        <div class="font-light text-sm tracking-wide text-gray-500 uppercase">BMP METRO PROJECT 2026</div>
        <div class="text-sm">
            <span class="font-light text-gray-500">Контакты:</span> 
            <a href="mailto:workerowerk@gmail.com" class="font-bold text-gray-900 hover:text-red-500 transition-colors ml-1">workerowerk@gmail.com</a>
        </div>
    </footer>

    <!-- Скрипт для работы приближения -->
    <script>
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeBtn = document.getElementById('closeModalBtn');
        const galleryImages = document.querySelectorAll('.gallery-img');

        // Открытие картинки
        galleryImages.forEach(img => {
            img.addEventListener('click', () => {
                modalImg.src = img.src; // Берем путь кликнутой картинки
                modal.classList.remove('hidden');
                
                // Небольшая задержка для запуска плавных анимаций
                setTimeout(() => {
                    modal.classList.remove('modal-fade-enter');
                    modal.classList.add('modal-fade-enter-active');
                    modalImg.classList.remove('modal-scale-enter');
                    modalImg.classList.add('modal-scale-enter-active');
                }, 10);
            });
        });

        // Функция закрытия окна
        const closeModal = () => {
            modal.classList.remove('modal-fade-enter-active');
            modal.classList.add('modal-fade-enter');
            modalImg.classList.remove('modal-scale-enter-active');
            modalImg.classList.add('modal-scale-enter');
            
            // Прячем элемент полностью после окончания анимации
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        };

        // Закрываем по клику на крестик
        closeBtn.addEventListener('click', closeModal);

        // Закрываем по клику на темный фон (но не на саму картинку)
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeModal();
            }
        });
    </script>
</body>
</html>
